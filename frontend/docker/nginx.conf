# Serves the built SPA and forwards the API to Django on the *same origin*.
#
# That forwarding is the whole point of this file. `src/api/client.ts` ships an
# empty base URL so the browser only ever talks to the origin that served the
# page, and in development the Vite dev server's proxy does the forwarding. The
# dev server is not in production, so without the `/api` block below that design
# decision silently inverts into cross-origin requests — which then fail on
# mixed content, CORS and Local Network Access exactly as the comment in
# client.ts says they would.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The .wasm entries matter: ONNX Runtime uses streaming compilation, which
    # refuses any response that is not application/wasm. Served as
    # octet-stream the models fall back to a slow path or fail outright.
    include /etc/nginx/mime.types;
    types {
        application/wasm                 wasm;
        application/manifest+json        webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        application/wasm image/svg+xml;

    # 21 MB of ONNX Runtime wasm, and model weights stream through the browser
    # rather than through here — but keep the proxy patient anyway.
    proxy_read_timeout 120s;
    client_max_body_size 25m;

    # ── Django ────────────────────────────────────────────────────────────────
    # /api is the contract. /admin and /static are here so the Django admin and
    # the DRF browsable API work on the deployed origin; WhiteNoise inside the
    # backend container serves what is under /static.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to decide a proxied request arrived over TLS — see
        # SECURE_PROXY_SSL_HEADER in core/settings/prod.py. The value comes from
        # the edge proxy that actually terminated TLS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Vite fingerprints everything under /assets, so it can be cached forever.
    # One header, not `expires` plus `add_header` — those emit two separate
    # Cache-Control lines, which is legal but not worth making a proxy reason
    # about.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading a
    # stale document that references fingerprinted chunks which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SPA history fallback ──────────────────────────────────────────────────
    # Without this a refresh on /object-detection asks nginx for a file that was
    # never built and gets a 404. Every deep link is served index.html and the
    # router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A container-level health check that does not wake the app.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
