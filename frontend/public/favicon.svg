<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Model Playground">
  <!--
    Model Playground mark: three nodes joined into a right-pointing triangle —
    a graph and a play button at once.

    The geometry here is mirrored in src/components/layout/Logo.tsx. Keep the two
    in sync: this file is a standalone asset (browser tab, manifest, OG image) and
    cannot import from src/, so the coordinates are duplicated on purpose.
  -->
  <defs>
    <linearGradient id="mp-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#193cb8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#mp-tile)"/>
  <g stroke="#fff" stroke-width="4.2" stroke-linecap="round" fill="#fff">
    <path d="M21 16 L21 48 M21 16 L47 32 M21 48 L47 32"/>
    <circle cx="21" cy="16" r="5.6"/>
    <circle cx="21" cy="48" r="5.6"/>
    <circle cx="47" cy="32" r="5.6"/>
  </g>
</svg>
