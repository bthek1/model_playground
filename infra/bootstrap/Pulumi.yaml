name: bootstrap
description: One-time, admin-applied CI identity for the static deploy (#57) — OIDC roles, scoped policies
# Self-managed state (#57): no Pulumi Cloud, so no long-lived access token.
# The bucket is created once by hand — deployment.md §10.2 — because it cannot
# be managed by a stack whose state it holds.
backend:
  url: s3://model-playground-pulumi-state-762233760445?region=ap-southeast-2
runtime:
  name: nodejs
  options:
    typescript: true
    packagemanager: npm
config:
  bootstrap:repo:
    type: string
  bootstrap:stateBucket:
    type: string
  bootstrap:siteBucket:
    type: string
    description: Must match site:bucketName.
  bootstrap:domain:
    type: string
    description: Must match site:domain.
  bootstrap:zoneId:
    type: string
    description: The zone site:zoneName resolves to. Route 53 writes are scoped to it.
