# Continuous integration.
#
# The repo had no CI at all, which is how `npm run build` came to fail outright
# (a spec imported app modules by dev-server URL, and tsc type-checks e2e/) while
# every local test stayed green.
#
# What deliberately does NOT run here: the `@slow` E2E specs and
# `just fe-e2e-models`. Those reach Hugging Face and download real ONNX weights —
# 80-220 MB a model — so they turn a two-minute job into a half-hour one and fail
# on any network hiccup. They are the only tests that exercise a real ONNX
# Runtime session, so they still have to be run by hand before shipping a model
# change (`just fe-e2e-slow`).
#
# Nor does the mocked suite against the *dev server* (`just fe-e2e`): it was the
# slowest job by far (~10 min) and mostly repeated `e2e-static`. What only it
# covered — the `@api` specs (sign-in, the registry UI the static build removes)
# and the `@devserver` specs that `load("/src/...")` — now runs by hand only.
#
# Continuous deployment (#57): a push to `main` is a release, and the `deploy`
# job puts the static frontend on S3 + CloudFront. It uploads the `dist`
# artifact the `frontend` job built — `VITE_BACKEND=off` — after `e2e-static`
# ran the mocked suite against those same bytes. AWS access is OIDC: no keys
# are stored anywhere. See docs/guides/deployment.md §10.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch cancels the previous run — except on `main`,
# where the run may be mid-upload. Cancelling that would leave a half-deployed
# site; the next release queues behind it instead (see `deploy` too).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      # `just be-lint`. Note that ruff has `fix = true` in pyproject.toml, so
      # this rewrites files locally — here it only reports, because a dirty
      # checkout in CI changes nothing. `ruff format` is deliberately not run:
      # the repo has never been held to it (`just be-fmt` is a manual tool) and
      # six files would need reformatting.
      - name: Lint
        working-directory: backend
        run: uv run ruff check --no-fix .

      # `SETTINGS` and `SECRET_KEY` are both required, and neither is optional
      # for a reason that is easy to miss:
      #
      #   SETTINGS     pytest sets `DJANGO_SETTINGS_MODULE=core.settings.test`
      #                (pyproject.toml), but importing that submodule runs the
      #                *package* `__init__.py` first, and that dispatches on
      #                `SETTINGS`, defaulting to `dev`. So without this, CI loads
      #                the dev settings no matter what pytest was told.
      #   SECRET_KEY   `base.py` reads it with no default. Locally it comes from
      #                the root `.env`, which is correctly never committed — so
      #                this step is the only place CI can supply one. The value
      #                is throwaway: `core.settings.test` uses sqlite and signs
      #                nothing that outlives the run.
      - name: Test
        working-directory: backend
        env:
          SETTINGS: test
          SECRET_KEY: ci-test-only-not-a-real-key
        run: uv run pytest -q

      # The settings module that actually ships. It requires SECRET_KEY,
      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS, so a missing one fails here
      # rather than on the server at boot.
      - name: Deployment checklist
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.prod
          ALLOWED_HOSTS: ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          DATABASE_URL: postgres://appuser:apppassword@localhost:5432/appdb
        run: |
          export SECRET_KEY="$(uv run python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          uv run python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      # `tsc -b` covers src/, e2e/ and vite.config.ts.
      #
      # Built as the *shipped* bundle, `VITE_BACKEND=off` (#57): this artifact
      # is what `e2e-static` tests and `deploy` uploads, so the deployed bytes
      # are the tested bytes. The flag changes no types.
      #
      # Analytics (#60): the PostHog *project* key is public and write-only, so
      # it is a repository variable, not a secret, and it is set on this build
      # only — unit tests stay analytics-free. Unset (a
      # fork, or before `just posthog-setup` has run) it is an empty string and
      # the bundle ships with analytics off. The personal `phx_` key never
      # appears in CI at all; `check:bundle` fails if one reaches dist/.
      - name: Build
        env:
          VITE_BACKEND: "off"
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: /ingest
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  # The shipped bundle under the same mocked suite: `vite preview` serves the
  # downloaded `dist`, and the `@api` specs (sign-in, the registry catalogue —
  # UI that build removes) are excluded, while `static-build.spec.ts` asserts
  # that no page asks /api anything.
  e2e-static:
    name: E2E (Playwright, the shipped static build)
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # E2E_ANALYTICS runs analytics.spec.ts — the payload privacy assertion —
      # whenever the artifact was built with a key. Every /ingest request is
      # answered by the fixture, so the run never reaches PostHog.
      - name: Run E2E against dist
        env:
          E2E_STATIC: "1"
          E2E_ANALYTICS: ${{ vars.VITE_POSTHOG_KEY != '' && '1' || '' }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-static
          path: frontend/playwright-report
          retention-days: 7

  infra:
    name: Infra (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Policies, the site stack under Pulumi mocks, the SPA rewrite, and the
      # upload script against a stub `aws`. No AWS credentials involved.
      - name: Test
        run: npx vitest run

  # Read-only drift check on every push to develop, so an infrastructure change
  # is visible before it is released. The preview role trusts exactly
  # `ref:refs/heads/develop` — which is why this job must not set an
  # `environment:` (that changes the OIDC subject). Skipped until the bootstrap
  # stack has been applied and its output set as a repository variable.
  preview:
    name: Infra preview (read-only)
    needs: infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_PREVIEW_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: pulumi/actions@v6

      - name: pulumi preview --refresh
        working-directory: infra/site
        run: pulumi preview --stack production --refresh --diff --non-interactive

  # A push to main is a release. `environment: production` is what the deploy
  # role's trust policy names, so no other job, branch or fork can assume it —
  # and the environment can require an approval.
  deploy:
    name: Deploy (S3 + CloudFront)
    needs: [frontend, e2e-static, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://playground.benedictthekkel.com
    permissions:
      id-token: write
      contents: read
    # Two releases never race an upload: the second waits, it is not cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      AWS_REGION: ap-southeast-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra

      # The bytes `e2e-static` tested. Never rebuilt here.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: pulumi/actions@v6

      - name: pulumi up
        working-directory: infra/site
        run: pulumi up --stack production --yes --non-interactive

      - name: Upload (assets first, index.html last, never delete)
        run: scripts/deploy-frontend.sh frontend/dist

      - name: Smoke test the live site
        run: scripts/smoke-frontend.sh https://playground.benedictthekkel.com frontend/dist

  images:
    name: Production images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. This is what catches a Dockerfile that
      # references a file the .dockerignore excludes, or a collectstatic that
      # fails because a setting became required.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          DOMAIN: ci.example.com
          ACME_EMAIL: ci@example.com
          SECRET_KEY: ci-validation-only
          ALLOWED_HOSTS: ci.example.com
          CSRF_TRUSTED_ORIGINS: https://ci.example.com
          POSTGRES_DB: appdb
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: ci-validation-only
